# Canonical career data for Nicolo DiFerdinando.
#
# This file is the single source of truth for roles, dates, education,
# projects, skills and public links. scripts/render.py turns it into
# build/resume.tex (the one-page resume) and build/profile.json (the public
# feed the portfolio sites read).
#
# Rules:
# - Public file: never add a phone number here. Private builds read the
#   RESUME_PHONE environment variable instead. render.py refuses to run if
#   this file holds a "phone" key or anything shaped like a phone number.
# - Plain text, not LaTeX: write "&", "%", "C++" as is; the renderer escapes
#   them. Use an en dash (U+2013) for ranges. Never an em dash (U+2014).
# - variants: optional list of variant names on any list item that is a
#   mapping (education, experience, bullet, project, leadership, skill row).
#   An item without variants appears in every build. An item with variants
#   appears only when render.py runs with --variant set to one of them. The
#   public PDF is the "default" variant, so tag an item [default, security]
#   to keep it on the public PDF but drop it from a "swe" build. The page is
#   already full: a variant that adds an item must drop another one.

